name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Windows too: evidence privacy (ACLs), path handling and line endings
    # differ there, and nothing else would notice a regression.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run schema
      - run: git diff --exit-code -- schemas/
      - run: npm test
      - run: npm run demo
